packages:
  - apps/*
  - packages/*

# Single source of truth for shared dependency versions.
# Reference them from any workspace package with "catalog:".
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true

catalog:
  '@types/node': ^24.0.0
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  lucide-react: ^1.61.0
  next: 16.4.3
  oxlint: ^1.89.0
  prettier: ^3.6.0
  prettier-plugin-tailwindcss: ^0.8.1
  radix-ui: ^1.8.1
  react: 19.3.0
  react-dom: 19.3.0
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  '@tailwindcss/turbopack': ^4.3.3
  turbo: ^2.11.10
  typescript: ~6.0.3
  vitest: ^4.1.2
  zod: ^4.6.7
