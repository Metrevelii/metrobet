# Git hooks (installed automatically by `pnpm install`).
# Skip once in an emergency with: LEFTHOOK=0 git commit ...

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{js,jsx,ts,tsx,mjs,cjs,json,css,md,yml,yaml}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    - name: lint
      glob: '*.{js,jsx,ts,tsx,mjs,cjs}'
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: conventional-commit
      run: |
        msg=$(head -n1 {1})
        if echo "$msg" | grep -qE '^(Merge|Revert|fixup!|squash!) '; then exit 0; fi
        if ! echo "$msg" | grep -qE '^(feat|fix|refactor|perf|chore|docs|test|ci|build|style|revert)(\([a-z0-9-]+\))?!?: .+'; then
          echo "✖ Commit message must follow Conventional Commits, e.g.:"
          echo "    feat(casino): add game tile"
          echo "    fix: handle empty betslip"
          echo "  Types: feat fix refactor perf chore docs test ci build style revert"
          exit 1
        fi
