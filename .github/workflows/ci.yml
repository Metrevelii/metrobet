name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: metrobet
          POSTGRES_PASSWORD: metrobet
          POSTGRES_DB: metrobet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metrobet"
          --health-interval 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

      # API end-to-end tests against the Postgres service (the test creates its own database).
      - run: pnpm --filter @metrobet/api test:e2e
        env:
          E2E_DATABASE_URL: postgres://metrobet:metrobet@localhost:5432/metrobet_test
